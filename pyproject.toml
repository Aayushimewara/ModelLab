[project]
name = "modellab"
version = "1.0.0"
description = "LoRA and QLoRA fine-tuning compared with full fine-tuning and few-shot prompting, with measured cost and quality"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4", "transformers>=4.50", "peft>=0.14", "bitsandbytes>=0.45",
  "tokenizers>=0.21", "safetensors>=0.4", "numpy>=1.26", "psutil>=5.9", "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modellab"]
